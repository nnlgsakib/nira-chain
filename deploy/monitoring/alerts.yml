# Alert rules (G-OPS-3). Metric names: CometBFT 0.38 (namespace "cometbft").
groups:
  - name: nira-consensus
    rules:
      - alert: ChainHalted
        expr: increase(cometbft_consensus_height[2m]) == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "No new block on {{ $labels.node }} for 3 minutes (> 1/3 offline, halt, or upgrade height)"
      - alert: BlockTimeHigh
        expr: rate(cometbft_consensus_block_interval_seconds_sum[5m]) / rate(cometbft_consensus_block_interval_seconds_count[5m]) > 4
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Mean block time > 4 s (target R-N1 p95 ≤ 4 s)"
      - alert: ValidatorsMissingVotes
        expr: cometbft_consensus_missing_validators_power / cometbft_consensus_validators_power > 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "> 10 % of voting power missing from commits for 5 m (at 1/3 the chain halts)"
      - alert: OwnValidatorNotSigning
        expr: cometbft_consensus_height - cometbft_consensus_validator_last_signed_height > 50
        labels: { severity: critical }
        annotations:
          summary: "This node's validator has not signed for > 50 blocks (downtime jail when signed < 5 % of the window)"
      - alert: ByzantineValidatorsSeen
        expr: cometbft_consensus_byzantine_validators > 0
        labels: { severity: critical }
        annotations:
          summary: "Equivocation evidence committed (double sign) — see slashing events"
      - alert: LowPeerCount
        expr: cometbft_p2p_peers < 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }} has < 3 peers (eclipse / partition risk, TM-07)"
      - alert: NodeCatchingUp
        expr: cometbft_blocksync_syncing == 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }} still syncing after 10 m"
  - name: nira-mempool
    rules:
      - alert: MempoolNearlyFull
        expr: cometbft_mempool_size > 3500
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Mempool > 3 500 txs (cap 4 096): spam or under-priced fee floor (K6)"
