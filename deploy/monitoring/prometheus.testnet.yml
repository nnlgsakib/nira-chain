# Prometheus for the Docker testnet (deploy/testnet): scrapes every node container by name.
global: { scrape_interval: 5s, evaluation_interval: 5s }
rule_files: [alerts.yml]
scrape_configs:
  - job_name: cometbft
    file_sd_configs: [{ files: [/etc/prometheus/targets.json] }]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: node
