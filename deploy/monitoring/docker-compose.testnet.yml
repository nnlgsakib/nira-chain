# Monitoring for the Docker testnet:
#   python3 deploy/testnet/testnet.py monitor   (writes targets.json, starts this stack)
# Prometheus http://127.0.0.1:9091 · Grafana http://127.0.0.1:3000 (admin/admin)
services:
  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: nira-mon-prometheus
    volumes:
      - ./prometheus.testnet.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./targets.json:/etc/prometheus/targets.json:ro
    ports: ["127.0.0.1:9091:9090"]
    networks: [nira]
  grafana:
    image: grafana/grafana:11.1.4
    container_name: nira-mon-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [nira]
networks:
  nira:
    name: nira-testnet_nira
    external: true
