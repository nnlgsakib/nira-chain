syntax = "proto3";
package nirachain.nirachain.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "nirachain/nirachain/v1/params.proto";

option go_package = "nira-chain/x/nirachain/types";

// GenesisState defines the nirachain module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
