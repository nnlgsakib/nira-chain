syntax = "proto3";
package nirachain.community.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "nira-chain/x/community/types";

// Params of the community participation layer. See docs/spec/community.md §7.
message Params {
  option (amino.name) = "nirachain/x/community/Params";
  option (gogoproto.equal) = true;

  string bond_denom = 1;
  string min_bond = 2 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  uint64 epoch_blocks = 3;
  uint32 target_committee = 4;
  uint32 tasks_per_selection = 5;
  uint32 max_proofs_per_epoch = 6;
  uint32 apphash_window = 7;
  repeated string sample_stores = 8;
  uint32 max_proof_bytes = 9;
  uint64 proof_gas_per_byte = 10;
  uint32 max_onion_length = 11;
  uint32 max_reveal_distance = 12;
  uint32 reward_share_bps = 13;
  uint64 unbonding_blocks = 14;
  uint32 max_unbond_per_block = 15;
  string alert_deposit = 16 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  uint64 alert_ttl_blocks = 17;
  uint32 max_open_alerts = 18;
  uint32 alert_threshold_bps = 19;
}
