syntax = "proto3";
package nirachain.community.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "nirachain/community/v1/params.proto";

option go_package = "nira-chain/x/community/types";

// Msg defines the community Msg service (docs/spec/community.md §6).
service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  rpc RegisterNode(MsgRegisterNode) returns (MsgRegisterNodeResponse);
  rpc RotateOnion(MsgRotateOnion) returns (MsgRotateOnionResponse);
  rpc SubmitTaskProof(MsgSubmitTaskProof) returns (MsgSubmitTaskProofResponse);
  rpc DeregisterNode(MsgDeregisterNode) returns (MsgDeregisterNodeResponse);
  rpc ReportDivergence(MsgReportDivergence) returns (MsgReportDivergenceResponse);
  rpc ResolveAlert(MsgResolveAlert) returns (MsgResolveAlertResponse);
}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "nirachain/x/community/MsgUpdateParams";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}
message MsgUpdateParamsResponse {}

message MsgRegisterNode {
  option (cosmos.msg.v1.signer) = "operator";
  option (amino.name) = "nirachain/x/community/MsgRegisterNode";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string moniker = 2;
  cosmos.base.v1beta1.Coin bond = 3 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  bytes onion_tip = 4;
  uint32 onion_length = 5;
}
message MsgRegisterNodeResponse {
  uint64 base_epoch = 1;
}

message MsgRotateOnion {
  option (cosmos.msg.v1.signer) = "operator";
  option (amino.name) = "nirachain/x/community/MsgRotateOnion";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes onion_tip = 2;
  uint32 onion_length = 3;
}
message MsgRotateOnionResponse {
  uint64 base_epoch = 1;
}

message MsgSubmitTaskProof {
  option (cosmos.msg.v1.signer) = "operator";
  option (amino.name) = "nirachain/x/community/MsgSubmitTaskProof";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 epoch = 2;
  bytes reveal = 3;
  uint32 task_index = 4;
  string store = 5;
  int64 height = 6;
  // value is the stored value for a membership proof; empty for non-membership.
  bytes value = 7;
  // proof is a protobuf-encoded ibc.core.commitment.v1.MerkleProof.
  bytes proof = 8;
}
message MsgSubmitTaskProofResponse {}

message MsgDeregisterNode {
  option (cosmos.msg.v1.signer) = "operator";
  option (amino.name) = "nirachain/x/community/MsgDeregisterNode";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgDeregisterNodeResponse {
  int64 unbond_complete_height = 1;
}

message MsgReportDivergence {
  option (cosmos.msg.v1.signer) = "operator";
  option (amino.name) = "nirachain/x/community/MsgReportDivergence";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  int64 height = 2;
  bytes claimed_app_hash = 3;
}
message MsgReportDivergenceResponse {
  uint64 alert_id = 1;
}

message MsgResolveAlert {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "nirachain/x/community/MsgResolveAlert";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 alert_id = 2;
  bool valid = 3;
}
message MsgResolveAlertResponse {}
