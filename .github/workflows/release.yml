# Release (G-OPS-4): runs ONLY when a version tag is pushed (v1.2.3, v1.2.3-rc.1).
# Builds nirad for linux (amd64, arm64; reproducible via make release), macOS
# (arm64, amd64) and Windows (amd64), writes one SHA256SUMS over every archive,
# signs it keylessly with Sigstore cosign (GitHub OIDC identity, no long-lived
# secret), and creates a draft GitHub release for a maintainer to publish.
#
# Archive names (the desktop app downloads these by name):
#   nirad-<tag>-<os>-<arch>.tar.gz   (linux, darwin)   containing  nirad
#   nirad-<tag>-windows-amd64.zip                      containing  nirad.exe
#
# Verify a release:
#   sha256sum -c SHA256SUMS --ignore-missing
#   cosign verify-blob SHA256SUMS --bundle SHA256SUMS.bundle \
#     --certificate-identity-regexp 'https://github.com/nnlgsakib/nira-chain/.github/workflows/release.yml@refs/(tags/v.*|heads/main)' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Release
on:
  push:
    tags: ["v*"]
  # re-run for an existing tag with the current workflow (the code built is the tag's)
  workflow_dispatch:
    inputs:
      tag: { description: "existing tag to build, e.g. v0.1.0", required: true }

permissions:
  contents: write   # create the draft release
  id-token: write   # keyless signing

env:
  CGO_ENABLED: "1"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make release VERSION=${{ env.TAG }}
      - run: build/release/nirad version
      - uses: actions/upload-artifact@v4
        with:
          name: nirad-linux-${{ matrix.arch }}
          path: build/release/*.tar.gz

  macos:
    runs-on: macos-latest   # Apple silicon; amd64 is cross-compiled with clang -arch x86_64 (macos-14 images are retired)
    strategy:
      matrix:
        include:
          - { arch: arm64, cc: clang }
          - { arch: amd64, cc: "clang -arch x86_64" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Build
        env: { GOARCH: "${{ matrix.arch }}", CC: "${{ matrix.cc }}" }
        run: |
          V=${{ env.TAG }}; C=$(git rev-parse HEAD)
          LD="-X github.com/cosmos/cosmos-sdk/version.Name=nira -X github.com/cosmos/cosmos-sdk/version.AppName=nirad -X github.com/cosmos/cosmos-sdk/version.Version=$V -X github.com/cosmos/cosmos-sdk/version.Commit=$C"
          mkdir -p out && go build -trimpath -mod=readonly -buildvcs=false -ldflags "$LD" -o out/nirad ./cmd/nirad
          [ "${{ matrix.arch }}" = arm64 ] && out/nirad version
          cd out && tar -czf nirad-$V-darwin-${{ matrix.arch }}.tar.gz nirad
      - uses: actions/upload-artifact@v4
        with:
          name: nirad-darwin-${{ matrix.arch }}
          path: out/*.tar.gz

  windows:
    runs-on: windows-latest   # has MinGW-w64 gcc on PATH for cgo
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Build
        run: |
          gcc --version | head -1
          V=${{ env.TAG }}; C=$(git rev-parse HEAD)
          LD="-X github.com/cosmos/cosmos-sdk/version.Name=nira -X github.com/cosmos/cosmos-sdk/version.AppName=nirad -X github.com/cosmos/cosmos-sdk/version.Version=$V -X github.com/cosmos/cosmos-sdk/version.Commit=$C"
          mkdir -p out && go build -trimpath -mod=readonly -buildvcs=false -ldflags "$LD" -o out/nirad.exe ./cmd/nirad
          out/nirad.exe version
          cd out && 7z a -tzip nirad-$V-windows-amd64.zip nirad.exe
      - uses: actions/upload-artifact@v4
        with:
          name: nirad-windows-amd64
          path: out/*.zip

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum nirad-* > SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - run: cd dist && cosign sign-blob --yes SHA256SUMS --bundle SHA256SUMS.bundle
      - name: Draft release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${{ env.TAG }}" dist/nirad-* dist/SHA256SUMS dist/SHA256SUMS.bundle \
            --repo "${{ github.repository }}" --draft --generate-notes \
            --title "Nira ${{ env.TAG }}"
