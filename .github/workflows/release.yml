# Release (G-OPS-4): runs ONLY when a version tag is pushed (v1.2.3, v1.2.3-rc.1).
# Builds the reproducible linux/amd64 + linux/arm64 tarballs (make release), writes
# SHA256SUMS, signs it keylessly with Sigstore cosign (GitHub OIDC identity, no
# long-lived secret), and creates a draft GitHub release for a maintainer to publish.
#
# Verify a release:
#   sha256sum -c SHA256SUMS
#   cosign verify-blob SHA256SUMS --bundle SHA256SUMS.bundle \
#     --certificate-identity-regexp 'https://github.com/nnlgsakib/nira-chain/.github/workflows/release.yml@refs/tags/v.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the draft release
  id-token: write   # keyless signing

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make release VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: nirad-${{ matrix.arch }}
          path: build/release/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - run: cd dist && cosign sign-blob --yes SHA256SUMS --bundle SHA256SUMS.bundle
      - name: Draft release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.bundle \
            --repo "${{ github.repository }}" --draft --generate-notes \
            --title "Nira ${{ github.ref_name }}"
