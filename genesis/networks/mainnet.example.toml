# Nira Chain — network genesis definition (TEMPLATE)
#
# This one file decides the whole initial economy and the initial operators.
# Edit it, then:
#   python3 scripts/genesis/build_genesis.py check      genesis/networks/<net>.toml   # validate + report
#   python3 scripts/genesis/build_genesis.py pregenesis genesis/networks/<net>.toml   # publish to validators
#   python3 scripts/genesis/build_genesis.py finalize   genesis/networks/<net>.toml --gentx-dir gentxs/
#
# Rules enforced by the builder:
# - Σ allocations + Σ validator balances + Σ community node (bond + balance) == supply.total, to the last anira
# - every address used once (bech32 nira1… or 0x…, same 20 bytes)
# - no validator ≥ rules.max_genesis_power_share of genesis voting power; ≥ rules.min_validators validators
# - community node bonds ≥ params.community.min_bond; onion tips are 32-byte hex
# - every gentx matches a listed validator and its self_bond exactly
#
# ALL VALUES BELOW ARE PROPOSALS (CHAIN.md Q1/Q3) — product/economic decisions
# to be confirmed before mainnet. Addresses are placeholders.

[chain]
chain_id = "nira_47201-1"                 # Cosmos chain-id; EVM chain ID 47201 is fixed in the binary
genesis_time = "2027-03-01T12:00:00Z"
denom = "anira"                           # 18 decimals, display "nira" (fixed)

[rules]
min_validators = 4
max_genesis_power_share = "0.3333"        # reject genesis if one validator could halt the chain alone

[supply]
total = "1000000000"                      # 1,000,000,000 NIRA

# ---------------------------------------------------------------- allocations
# kind = "account" (default) → a genesis account, optionally vesting
# kind = "community_pool"    → x/distribution community pool (protocol reserve, spend only via governance)
# vesting: continuous linear from `start` to `end`; omit `start` for a delayed (cliff-only) unlock at `end`.
#          (A "1y cliff + 3y linear" schedule = start at +1y, end at +4y.)

[[allocation]]
name = "Protocol reserve"
kind = "community_pool"
amount = "100000000"                      # 10 %

[[allocation]]
name = "Ecosystem & grants"
address = "0x00000000000000000000000000000000000000e1"
amount = "200000000"                      # 20 %
vesting = { start = "2027-03-01T12:00:00Z", end = "2031-03-01T12:00:00Z" }

[[allocation]]
name = "Core contributors"
address = "0x00000000000000000000000000000000000000c1"
amount = "150000000"                      # 15 %, 1y cliff then 3y linear
vesting = { start = "2028-03-01T12:00:00Z", end = "2031-03-01T12:00:00Z" }

[[allocation]]
name = "Early backers"
address = "0x00000000000000000000000000000000000000b1"
amount = "150000000"                      # 15 %, 6m cliff then 2y linear
vesting = { start = "2027-09-01T12:00:00Z", end = "2029-09-01T12:00:00Z" }

[[allocation]]
name = "Foundation operations"
address = "0x00000000000000000000000000000000000000f1"
amount = "100000000"                      # 10 %
vesting = { start = "2027-03-01T12:00:00Z", end = "2029-03-01T12:00:00Z" }

[[allocation]]
name = "Community node onboarding program"
address = "0x00000000000000000000000000000000000000a1"
amount = "100000000"                      # 10 %, distributed off-chain to new operators for bonds
vesting = { start = "2027-03-01T12:00:00Z", end = "2030-03-01T12:00:00Z" }

[[allocation]]
name = "Public distribution"
address = "0x00000000000000000000000000000000000000d1"
amount = "195957980"                      # remainder so the ledger sums exactly

# --------------------------------------------------------- initial Core Validators
# balance includes self_bond; each validator submits a gentx with exactly self_bond.

[[validator]]
moniker = "core-1"
address = "0x0000000000000000000000000000000000000101"
balance = "1010000"
self_bond = "1000000"

[[validator]]
moniker = "core-2"
address = "0x0000000000000000000000000000000000000102"
balance = "1010000"
self_bond = "1000000"

[[validator]]
moniker = "core-3"
address = "0x0000000000000000000000000000000000000103"
balance = "1010000"
self_bond = "1000000"

[[validator]]
moniker = "core-4"
address = "0x0000000000000000000000000000000000000104"
balance = "1010000"
self_bond = "1000000"

# --------------------------------------------------------- initial Community Nodes
# Operators run `nirad tx community onion-init` locally and send ONLY the tip.
# Bond is escrowed in x/community at genesis; balance is liquid for fees.

[[community_node]]
moniker = "genesis-node-1"
operator = "0x0000000000000000000000000000000000000201"
bond = "1000"
balance = "10"
onion_tip = "376da11fe3ab3d0eaaddb418ccb49b5426d5c2504f526f7766580f6e45984e3b"
onion_length = 100000

[[community_node]]
moniker = "genesis-node-2"
operator = "0x0000000000000000000000000000000000000202"
bond = "1000"
balance = "10"
onion_tip = "fe15c0d3ebe314fad720a08b839a004c2e6386f5aecc19ec74807d1920cb6aeb"
onion_length = 100000

# ------------------------------------------------------------------- economics
# Module parameters (any genesis params field). "X NIRA" is converted to anira.
# All are changeable later by governance; these are the launch values.

[params.mint]
inflation_max = "0.100000000000000000"    # 10 % / year ceiling
inflation_min = "0.030000000000000000"    # 3 % / year floor (tail emission for the security budget)
goal_bonded = "0.600000000000000000"      # inflation rises while < 60 % of supply is staked
inflation_rate_change = "0.100000000000000000"
blocks_per_year = "15768000"              # ~2 s blocks

[params.distribution]
community_tax = "0.020000000000000000"    # 2 % of block rewards → community pool

[params.staking]
max_validators = 100
unbonding_time = "1814400s"               # 21 days
min_commission_rate = "0.050000000000000000"

[params.slashing]
signed_blocks_window = "10000"
min_signed_per_window = "0.050000000000000000"
downtime_jail_duration = "600s"
slash_fraction_double_sign = "0.050000000000000000"
slash_fraction_downtime = "0.000100000000000000"

[params.gov]
min_deposit = [{ denom = "anira", amount = "10000 NIRA" }]
expedited_min_deposit = [{ denom = "anira", amount = "50000 NIRA" }]
voting_period = "432000s"                 # 5 days
expedited_voting_period = "86400s"
quorum = "0.334000000000000000"
threshold = "0.500000000000000000"
veto_threshold = "0.334000000000000000"

[params.feemarket]
min_gas_price = "10000000000.000000000000000000"   # 10 gwei floor: closes risk K6 (near-free spam)

[params.policy]                        # ADR-0004 voting-power cap
max_validator_power_bps = 1000
cap_activation_bonded = "5000000 NIRA"
cap_activation_min_validators = 15

[params.community]                        # docs/spec/community.md §7
min_bond = "1000 NIRA"
epoch_blocks = "600"
target_committee = 64
tasks_per_selection = 2
max_proofs_per_epoch = 1024
reward_share_bps = 1500                   # 15 % of fees + inflation to verified community work
unbonding_blocks = "100800"
alert_deposit = "100 NIRA"

[app_state.mint.minter]
inflation = "0.070000000000000000"        # starting inflation
